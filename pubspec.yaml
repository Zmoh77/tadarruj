# Chemin : pubspec.yaml
name: tadarruj
description: "TADARRUJ - Planificateur intelligent d'apprentissage du Coran."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  google_fonts: ^9.0.0
  hijri: ^3.0.1
  intl: any
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Active la génération automatique des fichiers de langue (.arb)
  generate: true

  fonts:
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic.ttf
